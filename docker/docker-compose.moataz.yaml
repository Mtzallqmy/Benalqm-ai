# moataz ai local/LAN overlay
# Usage:
#   docker compose --env-file ../.env.moataz -f docker-compose.yaml -f docker-compose.moataz.yaml up -d --build

services:
  nginx:
    container_name: moataz-ai-nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2026/ || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 10

  frontend:
    container_name: moataz-ai-frontend
    environment:
      - MOATAZ_ANDROID_PACKAGE_NAME=${MOATAZ_ANDROID_PACKAGE_NAME:-ai.moataz.app}
      - MOATAZ_ANDROID_CERT_SHA256=${MOATAZ_ANDROID_CERT_SHA256:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  gateway:
    container_name: moataz-ai-gateway
    build:
      args:
        MOATAZ_CRYPTOGRAPHY_VERSION: ${MOATAZ_CRYPTOGRAPHY_VERSION:-50.0.1}
    environment:
      - MOATAZ_PROVIDER_MASTER_KEY=${MOATAZ_PROVIDER_MASTER_KEY}
      - MOATAZ_PROVIDER_NETWORK_POLICY=${MOATAZ_PROVIDER_NETWORK_POLICY:-local}
      - NO_PROXY=${NO_PROXY:-}${NO_PROXY:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,redis,host.docker.internal
      - no_proxy=${no_proxy:-}${no_proxy:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,redis,host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    container_name: moataz-ai-redis
